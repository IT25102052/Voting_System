<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Voting History')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page" style="max-width:700px">
    <h2 class="rv-page-title mb-4"><i class="fa-solid fa-clock-rotate-left"></i> My Voting History</h2>

    <div class="rv-card text-center py-5" th:if="${#lists.isEmpty(votes)}">
        <p class="text-muted mb-0">You haven't voted yet. <a th:href="@{/vote}">See open sessions &rarr;</a></p>
    </div>

    <div th:each="v : ${votes}" class="show-card d-flex justify-content-between align-items-center">
        <div>
            <div class="fw-semibold" th:text="${v.contestant.fullName}">Contestant</div>
            <small class="text-muted"
                   th:text="${v.votingSession.episode.season.show.name} + ' — Ep. ' + ${v.votingSession.episode.episodeNumber}"></small>
        </div>
        <small class="text-muted" th:text="${v.votedAt}"></small>
    </div>
</div>
</body>
</html>
