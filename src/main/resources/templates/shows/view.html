<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${show.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page">
    <a class="btn btn-sm btn-outline-secondary mb-3" th:href="@{/admin/shows}">&larr; Back to Shows</a>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="rv-card mb-4">
        <img th:if="${show.posterImagePath}" th:src="@{'/uploads/' + ${show.posterImagePath}}" alt="Show poster"
             class="rv-show-banner mb-4">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h2 class="rv-page-title" th:text="${show.name}">Show Name</h2>
                <span class="status-badge" th:classappend="'status-' + ${show.status}" th:text="${show.status}"></span>
                <p class="mt-3 mb-1" th:text="${show.description}">Description</p>
                <small class="text-muted">
                    Category: <span th:text="${show.category}"></span> &nbsp;|&nbsp;
                    <span th:text="${show.startDate}"></span> &rarr; <span th:text="${show.endDate}"></span>
                </small>
            </div>
            <a class="btn btn-outline-primary" th:href="@{'/admin/shows/' + ${show.id} + '/edit'}">Edit</a>
        </div>
    </div>

    <div class="rv-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="rv-page-title mb-0" style="font-size:1.3rem;"><i class="fa-solid fa-layer-group"></i> Seasons</h5>
            <a class="btn btn-sm btn-accent" th:href="@{'/admin/shows/' + ${show.id} + '/seasons/new'}">
                <i class="fa-solid fa-plus"></i> Add Season
            </a>
        </div>

        <div class="text-center py-4" th:if="${#lists.isEmpty(show.seasons)}">
            <i class="fa-solid fa-layer-group fa-2x mb-3" style="color:#4a4d58"></i>
            <p class="text-muted mb-0">No seasons yet. Add one to start scheduling episodes.</p>
        </div>

        <div th:each="season : ${show.seasons}" class="show-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="fw-semibold">
                    Season <span th:text="${season.seasonNumber}" class="rv-mono"></span>
                    <small class="text-muted ms-2" th:if="${season.startDate}">
                        <span th:text="${season.startDate}"></span> &rarr; <span th:text="${season.endDate}"></span>
                    </small>
                </div>
                <a class="btn btn-sm btn-outline-dark"
                   th:href="@{'/admin/shows/' + ${show.id} + '/seasons/' + ${season.id} + '/episodes/new'}">
                    <i class="fa-solid fa-plus"></i> Add Episode
                </a>
            </div>

            <p class="text-muted small mb-0" th:if="${#lists.isEmpty(season.episodes)}">No episodes yet.</p>
            <ul class="list-group" th:unless="${#lists.isEmpty(season.episodes)}">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    th:each="ep : ${season.episodes}">
                    <span>
                        <span class="rv-mono text-muted">Ep. <span th:text="${ep.episodeNumber}"></span></span>
                        &nbsp;<span th:text="${ep.title}"></span>
                    </span>
                    <small class="text-muted" th:if="${ep.airDate}" th:text="${ep.airDate}"></small>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
