<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Alert')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="rv-page" style="max-width:680px">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a class="btn btn-sm btn-outline-dark"
           th:href="@{/compliance/alerts/{id}(id=${alert.id})}">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
        <h2 class="rv-page-title mb-0">Edit Alert #<span th:text="${alert.id}"></span></h2>
    </div>
    <div class="rv-card">
        <p class="text-muted small mb-3">
            <i class="fa-solid fa-lock"></i>
            The title is locked after creation. You can update the status and description.
        </p>
        <form method="post" th:action="@{/compliance/alerts/{id}(id=${alert.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label">Title (read-only)</label>
                <input type="text" class="form-control" th:value="${alert.title}" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option th:each="s : ${statuses}"
                            th:value="${s}" th:text="${s}"
                            th:selected="${alert.status == s}"></option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label">Description</label>
                <textarea class="form-control" rows="5" name="description"
                          th:text="${alert.description}"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-accent" type="submit">Update</button>
                <a th:href="@{/compliance/alerts/{id}(id=${alert.id})}"
                   class="btn btn-outline-dark">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
