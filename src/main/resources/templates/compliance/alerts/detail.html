<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alert Detail')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<style>
.severity-LOW{background:#1e2130;color:#9ba3b0;border:1px solid #2d3140;}
.severity-MEDIUM{background:#1a2340;color:#00e5ff;border:1px solid #00e5ff44;}
.severity-HIGH{background:#2d1a1a;color:#ffc857;border:1px solid #ffc85744;}
.severity-CRITICAL{background:#3d1a1a;color:#ff5c72;border:1px solid #ff5c7244;}
</style>
<div class="rv-page" style="max-width:800px">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/compliance/alerts}" class="btn btn-sm btn-outline-dark">
            <i class="fa-solid fa-arrow-left"></i> Alerts
        </a>
        <h2 class="rv-page-title mb-0">
            <i class="fa-solid fa-bell"></i> Alert #<span th:text="${alert.id}"></span>
        </h2>
        <span class="status-badge"
              th:classappend="'severity-' + ${alert.severity}"
              th:text="${alert.severity}"></span>
        <span class="status-badge"
              th:classappend="'status-' + ${alert.status}"
              th:text="${alert.status}"></span>
    </div>

    <div class="alert alert-info" th:if="${flash}" th:text="${flash}"></div>

    <div class="rv-card mb-3">
        <h5 class="rv-mono mb-3" style="color:var(--rv-cyan)" th:text="${alert.title}"></h5>
        <table class="table table-sm mb-0" style="font-size:.85rem;">
            <tbody>
            <tr><th style="color:var(--rv-text-muted);width:160px">Raised by</th>
                <td th:text="${alert.raisedByEmail}"></td></tr>
            <tr><th style="color:var(--rv-text-muted)">Raised at</th>
                <td th:text="${alert.createdDate}"></td></tr>
            <tr th:if="${alert.sessionId != null}">
                <th style="color:var(--rv-text-muted)">Linked session</th>
                <td><a class="rv-mono" th:href="@{/compliance/verify/{id}(id=${alert.sessionId})}"
                       th:text="'Session #' + ${alert.sessionId}"></a></td></tr>
            <tr th:if="${alert.relatedActorEmail != null and alert.relatedActorEmail != ''}">
                <th style="color:var(--rv-text-muted)">Related actor</th>
                <td class="rv-mono" th:text="${alert.relatedActorEmail}"></td></tr>
            <tr th:if="${alert.resolvedAt != null}">
                <th style="color:var(--rv-text-muted)">Resolved at</th>
                <td th:text="${alert.resolvedAt}"></td></tr>
            <tr><th style="color:var(--rv-text-muted)">Last updated</th>
                <td th:text="${alert.updatedDate}"></td></tr>
            </tbody>
        </table>
    </div>

    <div class="rv-card mb-4">
        <div class="text-muted small mb-2">Description</div>
        <div style="white-space:pre-wrap;line-height:1.6;"
             th:text="${alert.description != null ? alert.description : 'No description provided.'}"></div>
    </div>

    <div class="rv-card" th:if="${alert.status != T(com.slit.realityvote.entity.AlertStatus).RESOLVED}">
        <h6 class="mb-3">Update Alert</h6>
        <form method="post" th:action="@{/compliance/alerts/{id}(id=${alert.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small">New Status</label>
                    <select class="form-select" name="status">
                        <option th:each="s : ${statuses}"
                                th:value="${s}" th:text="${s}"
                                th:selected="${alert.status == s}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small">Update Description (optional)</label>
                    <input type="text" class="form-control" name="description"
                           placeholder="Add investigation notes...">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-accent w-100" type="submit">Save</button>
                </div>
            </div>
        </form>
    </div>

    <div class="d-flex gap-2 mt-3">
        <a class="btn btn-sm btn-outline-dark"
           th:href="@{/compliance/alerts/{id}/edit(id=${alert.id})}">
            <i class="fa-solid fa-pen"></i> Edit Details
        </a>
        <a th:if="${alert.sessionId != null}"
           class="btn btn-sm btn-outline-dark"
           th:href="@{/compliance/anomalies(sessionId=${alert.sessionId})}">
            <i class="fa-solid fa-bug"></i> Anomaly Detection
        </a>
    </div>
</div>
</body>
</html>
