<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Raise Security Alert')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="rv-page" style="max-width:680px">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/compliance/alerts}" class="btn btn-sm btn-outline-dark">
            <i class="fa-solid fa-arrow-left"></i> Alerts
        </a>
        <h2 class="rv-page-title mb-0">
            <i class="fa-solid fa-bell-exclamation"></i> Raise Security Alert
        </h2>
    </div>

    <div class="rv-card">
        <form method="post" class="js-validate" th:action="@{/compliance/alerts}" th:object="${alert}">
            <div class="alert alert-danger" th:if="${formError}" th:text="${formError}"></div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label class="form-label" for="title">Title <span class="text-danger">*</span></label>
                <input type="text" id="title" class="form-control" th:field="*{title}"
                       required minlength="3" maxlength="150"
                       placeholder="e.g. Suspicious vote spike — Session #12"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                <div class="invalid-feedback"
                     th:text="${#fields.hasErrors('title')} ? ${#fields.errors('title')[0]} : 'Title is required (3–150 characters).'">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="severity">Severity <span class="text-danger">*</span></label>
                <select id="severity" class="form-select" th:field="*{severity}" required
                        th:classappend="${#fields.hasErrors('severity')} ? 'is-invalid'">
                    <option th:each="s : ${severities}" th:value="${s}" th:text="${s}"></option>
                </select>
                <div class="invalid-feedback"
                     th:text="${#fields.hasErrors('severity')} ? ${#fields.errors('severity')[0]} : 'Severity is required.'">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="sessionId">Linked Session (optional)</label>
                <select id="sessionId" class="form-select" th:field="*{sessionId}"
                        th:classappend="${#fields.hasErrors('sessionId')} ? 'is-invalid'">
                    <option value="">— None —</option>
                    <option th:each="s : ${sessions}"
                            th:value="${s.id}"
                            th:text="'Session #' + ${s.id} + ' (' + ${s.status} + ')'">
                    </option>
                </select>
                <div class="invalid-feedback"
                     th:text="${#fields.hasErrors('sessionId')} ? ${#fields.errors('sessionId')[0]} : 'Select a valid voting session.'">
                </div>
            </div>

            <div class="mb-3">
                <label for="relatedActorEmail" class="form-label">
                    Related Actor Email <span class="text-danger">*</span>
                </label>
                <input type="email"
                       id="relatedActorEmail"
                       class="form-control"
                       th:field="*{relatedActorEmail}"
                       required maxlength="254"
                       placeholder="voter11@example.com"
                       th:classappend="${#fields.hasErrors('relatedActorEmail')} ? 'is-invalid'">
                <div class="invalid-feedback"
                     th:text="${#fields.hasErrors('relatedActorEmail')} ? ${#fields.errors('relatedActorEmail')[0]} : 'Enter a valid related actor email.'">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" class="form-control" rows="5"
                          th:field="*{description}"
                          maxlength="2000"
                          placeholder="Describe the suspicious pattern, what triggered this alert, and any immediate actions recommended."
                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback"
                     th:text="${#fields.hasErrors('description')} ? ${#fields.errors('description')[0]} : 'Description must not exceed 2000 characters.'">
                </div>
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-accent" type="submit">
                    <i class="fa-solid fa-bell"></i> Raise Alert
                </button>
                <a th:href="@{/compliance/alerts}" class="btn btn-outline-dark">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
