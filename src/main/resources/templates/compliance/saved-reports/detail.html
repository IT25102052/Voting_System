<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Saved Report')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="rv-page" style="max-width:800px">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/compliance/saved-reports}" class="btn btn-sm btn-outline-dark">
            <i class="fa-solid fa-arrow-left"></i> Reports
        </a>
        <h2 class="rv-page-title mb-0">
            <i class="fa-solid fa-file-shield"></i>
            Compliance Report #<span th:text="${record.id}"></span>
        </h2>
        <span class="status-badge"
              th:classappend="${record.status.name() == 'FILED'} ? 'status-ACTIVE' : 'status-ARCHIVED'"
              th:text="${record.status}"></span>
    </div>

    <div class="alert alert-info" th:if="${flash}" th:text="${flash}"></div>

    <div class="rv-card mb-3">
        <table class="table table-sm mb-0" style="font-size:.85rem;">
            <tr><th style="color:var(--rv-text-muted);width:160px">Session</th>
                <td th:text="${record.sessionDescription}"></td></tr>
            <tr><th style="color:var(--rv-text-muted)">Integrity Status</th>
                <td>
                    <span class="status-badge"
                          th:classappend="${record.integrityStatus == 'OK'} ? 'status-ACTIVE' : (${record.integrityStatus == 'WARNING'} ? 'status-SCHEDULED' : 'status-ELIMINATED')"
                          th:text="${record.integrityStatus}"></span>
                </td></tr>
            <tr><th style="color:var(--rv-text-muted)">Total Votes</th>
                <td class="rv-mono" th:text="${record.totalVotes}"></td></tr>
            <tr><th style="color:var(--rv-text-muted)">Total Flagged</th>
                <td class="rv-mono" th:text="${record.totalFlagged}"></td></tr>
            <tr><th style="color:var(--rv-text-muted)">Rejections</th>
                <td class="rv-mono" th:text="${record.totalRejected}"></td></tr>
            <tr><th style="color:var(--rv-text-muted)">Generated at</th>
                <td th:text="${record.generatedAt}"></td></tr>
            <tr><th style="color:var(--rv-text-muted)">Raised by</th>
                <td th:text="${record.raisedByEmail}"></td></tr>
            <tr th:if="${record.filedAt != null}">
                <th style="color:var(--rv-text-muted)">Filed at</th>
                <td th:text="${record.filedAt}"></td></tr>
        </table>
    </div>

    <div class="rv-card mb-4">
        <div class="text-muted small mb-2">Recommendations</div>
        <pre style="color:#e4e7ef;font-size:.84rem;white-space:pre-wrap;"
             th:text="${record.recommendations}"></pre>
    </div>

    <div class="d-flex gap-2">
        <form method="post"
              th:action="@{/compliance/saved-reports/{id}/file(id=${record.id})}"
              th:if="${record.status.name() == 'DRAFT'}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-accent" type="submit">
                <i class="fa-solid fa-stamp"></i> File Report
            </button>
        </form>
        <a class="btn btn-sm btn-outline-dark"
           th:href="@{/compliance/reports/{id}(id=${record.sessionId})}">
            <i class="fa-solid fa-sync"></i> Re-generate Live Report
        </a>
    </div>
</div>
</body>
</html>
