<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Saved Compliance Reports')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="rv-page" style="max-width:1100px">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/compliance/dashboard}" class="btn btn-sm btn-outline-dark d-inline-flex align-items-center gap-1">
            <span th:replace="~{fragments/heroicons :: arrowLeft('heroicon-sm')}"></span> Dashboard
        </a>
        <h2 class="rv-page-title mb-0 d-flex align-items-center gap-2">
            <span th:replace="~{fragments/heroicons :: shieldCheck('heroicon-md')}"></span> Saved Compliance Reports
        </h2>
    </div>

    <div class="rv-card text-center py-5" th:if="${#lists.isEmpty(records)}">
        <span th:replace="~{fragments/heroicons :: documentPlus('heroicon-xl mb-3')}" style="color:#00e5ff;opacity:.4;display:inline-block;"></span>
        <p class="text-muted mb-0">No compliance reports have been saved yet.</p>
        <p class="text-muted small mt-1">
            Open a session's Full Report and click "Save as Draft" to create one.
        </p>
    </div>

    <div class="rv-card p-0" th:unless="${#lists.isEmpty(records)}">
        <table class="table mb-0">
            <thead>
            <tr>
                <th>#</th><th>Session</th><th>Integrity</th>
                <th>Votes</th><th>Status</th><th>Generated</th><th>Filed</th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${records}">
                <td class="rv-mono text-muted small" th:text="${r.id}"></td>
                <td th:text="${r.sessionDescription}"></td>
                <td>
                    <span class="status-badge"
                          th:classappend="${r.integrityStatus == 'OK'} ? 'status-ACTIVE' : (${r.integrityStatus == 'WARNING'} ? 'status-SCHEDULED' : 'status-ELIMINATED')"
                          th:text="${r.integrityStatus}"></span>
                </td>
                <td class="rv-mono" th:text="${r.totalVotes}"></td>
                <td>
                    <span class="status-badge"
                          th:classappend="${r.status.name() == 'FILED'} ? 'status-ACTIVE' : 'status-ARCHIVED'"
                          th:text="${r.status}"></span>
                </td>
                <td class="small text-muted" th:text="${r.generatedAt}"></td>
                <td class="small text-muted" th:text="${r.filedAt != null ? r.filedAt : '—'}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-dark"
                       th:href="@{/compliance/saved-reports/{id}(id=${r.id})}"
                       title="View Saved Report">
                        <span th:replace="~{fragments/heroicons :: eye('heroicon-sm')}"></span>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
