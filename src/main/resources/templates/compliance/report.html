<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Compliance Report')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page" style="max-width:900px">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/compliance/dashboard}" class="btn btn-sm btn-outline-dark">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
            </a>
            <h2 class="rv-page-title mb-0"><i class="fa-solid fa-file-alt"></i> Compliance Report</h2>
        </div>
        <div class="d-flex gap-2">
            <form method="post"
                  th:action="@{/compliance/reports/{id}/save(id=${report.sessionId})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-dark" type="submit">
                    <i class="fa-solid fa-floppy-disk"></i> Save as Draft
                </button>
            </form>
            <a class="btn btn-sm btn-outline-dark" th:href="@{/compliance/saved-reports}">
                <i class="fa-solid fa-file-shield"></i> Saved Reports
            </a>
            <a class="btn btn-accent btn-sm"
               th:href="@{/compliance/reports/{id}/export(id=${report.sessionId})}">
                <i class="fa-solid fa-file-csv"></i> Export CSV
            </a>
        </div>
    </div>


    <div class="rv-card mb-4">
        <div class="row g-3">
            <div class="col-md-6">
                <div class="text-muted small">Session</div>
                <div class="rv-mono fw-bold" th:text="${report.sessionDescription}"></div>
            </div>
            <div class="col-md-6 text-md-end">
                <div class="text-muted small">Report Generated</div>
                <div class="rv-mono" th:text="${#temporals.format(report.reportGeneratedAt,'dd MMM yyyy HH:mm:ss')}"></div>
            </div>
        </div>
    </div>

    <!-- Activity Summary -->
    <div class="rv-card mb-4">
        <h5 class="rv-page-title mb-3"><i class="fa-solid fa-chart-bar"></i> Voting Activity</h5>
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <div class="text-muted small">Total Votes</div>
                <div class="rv-mono fw-bold" style="color:var(--rv-cyan);font-size:1.6rem;"
                     th:text="${report.activityStats.totalVotes}"></div>
            </div>
            <div class="col-md-4">
                <div class="text-muted small">Rejected</div>
                <div class="rv-mono fw-bold" style="font-size:1.6rem;"
                     th:style="'font-size:1.6rem;' + (${report.activityStats.totalRejected > 0} ? 'color:#ff5c72' : 'color:var(--rv-cyan)')"
                     th:text="${report.activityStats.totalRejected}"></div>
            </div>
            <div class="col-md-4">
                <div class="text-muted small">Contestants</div>
                <div class="rv-mono fw-bold" style="color:var(--rv-cyan);font-size:1.6rem;"
                     th:text="${report.activityStats.votesByContestantName.size()}"></div>
            </div>
        </div>
    </div>

    <!-- Anomaly Summary -->
    <div class="rv-card mb-4">
        <h5 class="rv-page-title mb-3"><i class="fa-solid fa-bug"></i> Anomaly Detection</h5>
        <div class="mb-2">
            <span class="status-badge"
                  th:classappend="${report.anomalyReport.totalFlaggedEvents > 0} ? 'status-ELIMINATED' : 'status-ACTIVE'"
                  th:text="${report.anomalyReport.totalFlaggedEvents} + ' flagged events'"></span>
        </div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item bg-transparent" style="border-color:var(--rv-border);"
                th:each="desc : ${report.anomalyReport.anomalyDescriptions}">
                <i class="fa-solid fa-circle-dot text-warning me-2"></i>
                <span th:text="${desc}"></span>
            </li>
        </ul>
    </div>

    <!-- Integrity Summary -->
    <div class="rv-card mb-4">
        <h5 class="rv-page-title mb-3"><i class="fa-solid fa-check-double"></i> Integrity Verification</h5>
        <div class="d-flex align-items-center gap-3 mb-3">
            <span class="status-badge"
                  th:classappend="${report.integrityReport.integrityStatus == 'OK'} ? 'status-ACTIVE' :
                                  (${report.integrityReport.integrityStatus == 'WARNING'} ? 'status-SCHEDULED' : 'status-ELIMINATED')"
                  th:text="${report.integrityReport.integrityStatus}"></span>
            <span class="text-muted small">
                Stored: <span class="rv-mono" th:text="${report.integrityReport.storedVoteCount}"></span>
                &nbsp;/&nbsp; Audited: <span class="rv-mono" th:text="${report.integrityReport.auditedVoteCount}"></span>
            </span>
        </div>
    </div>

    <!-- Recommendations -->
    <div class="rv-card">
        <h5 class="rv-page-title mb-3"><i class="fa-solid fa-lightbulb"></i> Recommendations</h5>
        <ul class="mb-0">
            <li th:each="r : ${report.recommendations}" th:text="${r}" class="mb-1"></li>
        </ul>
    </div>
</div>
</body>
</html>
