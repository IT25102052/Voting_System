<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Audit Logs')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page" style="max-width:1000px">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="rv-page-title"><i class="fa-solid fa-shield-halved"></i> Audit &amp; Compliance</h2>
        <span class="status-badge status-ELIMINATED" th:if="${flaggedCount > 0}">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${flaggedCount}"></span> flagged
        </span>
    </div>

    <form class="rv-card mb-4 row g-2 align-items-end" method="get" th:action="@{/compliance/audit-logs}">
        <div class="col-md-3">
            <label class="form-label mb-1">Actor email contains</label>
            <input type="text" name="keyword" class="form-control" th:value="${keyword}">
        </div>
        <div class="col-md-3">
            <label class="form-label mb-1">Event Type</label>
            <select name="eventType" class="form-select">
                <option value="">All Types</option>
                <option th:each="et : ${eventTypes}" th:value="${et}" th:text="${et}"
                        th:selected="${eventType != null and eventType == et}"></option>
            </select>
        </div>
        <div class="col-md-3 form-check mb-2">
            <input class="form-check-input" type="checkbox" name="flaggedOnly" value="true" id="flaggedOnly"
                   th:checked="${flaggedOnly}">
            <label class="form-check-label" for="flaggedOnly">Flagged only</label>
        </div>
        <div class="col-md-3">
            <button class="btn btn-outline-dark w-100" type="submit">Apply</button>
        </div>
    </form>

    <div class="rv-card text-center py-5" th:if="${logPage.totalElements == 0}">
        <p class="text-muted mb-0">No audit events match this filter.</p>
    </div>

    <div class="rv-card" th:unless="${logPage.totalElements == 0}">
        <div class="rv-timeline">
            <div class="rv-timeline-item" th:each="log : ${logPage.content}" th:classappend="${log.flagged} ? 'flagged'">
                <div class="rv-timeline-time" th:text="${log.createdDate}"></div>
                <div class="rv-timeline-card">
                    <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                        <span class="status-badge"
                              th:classappend="${log.eventType.name() == 'VOTE_CAST' or log.eventType.name() == 'LOGIN_SUCCESS' or log.eventType.name() == 'SESSION_OPENED'} ? 'status-ACTIVE' : (${log.eventType.name() == 'SUSPICIOUS_ACTIVITY'} ? 'status-ELIMINATED' : 'status-ARCHIVED')"
                              th:text="${log.eventType}"></span>
                        <i class="fa-solid fa-triangle-exclamation" style="color:var(--rv-danger)" th:if="${log.flagged}" title="Flagged event"></i>
                        <span class="text-muted small" th:text="${log.actorEmail}"></span>
                    </div>
                    <div th:text="${log.description}"></div>
                </div>
            </div>
        </div>
    </div>

    <nav class="mt-4" th:if="${logPage.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, logPage.totalPages - 1)}"
                th:classappend="${i == logPage.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/compliance/audit-logs(page=${i}, keyword=${keyword}, eventType=${eventType}, flaggedOnly=${flaggedOnly})}"
                   th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>

</div>
</body>
</html>
