<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New Support Request')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page" style="max-width:600px">
    <h2 class="rv-page-title mb-4"><i class="fa-solid fa-headset"></i> Contact Support</h2>

    <form class="rv-card" method="post" th:action="@{/support/tickets}">
        <div class="mb-3">
            <label class="form-label">Subject</label>
            <input type="text" name="subject" class="form-control" required maxlength="150">
        </div>
        <div class="mb-4">
            <label class="form-label">Describe the issue</label>
            <textarea name="description" class="form-control" rows="5" required></textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-accent px-4">
                <i class="fa-solid fa-paper-plane"></i> Submit Ticket
            </button>
            <a class="btn btn-outline-secondary" th:href="@{/support/tickets}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
