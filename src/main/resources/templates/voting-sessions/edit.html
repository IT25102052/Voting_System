<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Edit Voting Session')}"></head>

<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page" style="max-width:700px">

    <h2 class="rv-page-title mb-4">
        <i class="fa-solid fa-pen"></i>
        Edit Voting Session
    </h2>


    <!-- General error -->
    <div class="alert alert-danger"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>


    <form class="rv-card"
          method="post"
          th:object="${sessionForm}"
          th:action="@{'/admin/voting-sessions/' + ${votingSession.id} + '/edit'}">


        <!-- Global validation errors -->
        <div class="alert alert-danger"
             th:if="${#fields.hasGlobalErrors()}">

            <div th:each="err : ${#fields.globalErrors()}"
                 th:text="${err}">
            </div>

        </div>


        <!-- EPISODE -->
        <div class="mb-3">

            <label class="form-label">
                Episode
            </label>

            <input type="text"
                   class="form-control"
                   readonly
                   th:value="${votingSession.episode.season.show.name + ' - Ep. ' + votingSession.episode.episodeNumber + ': ' + votingSession.episode.title}">

            <small class="text-muted">
                The episode cannot be changed. Delete the session and create a new one to use a different episode.
            </small>

        </div>


        <!-- CONTESTANTS -->
        <div class="mb-3">

            <label class="form-label">
                Contestants in this voting round
            </label>

            <div class="rv-card"
                 style="max-height:220px; overflow-y:auto; padding:1rem;">

                <span class="text-muted"
                      th:if="${#lists.isEmpty(showContestants)}">

                    No contestants found for this show.

                </span>


                <div class="form-check"
                     th:each="c : ${showContestants}">

                    <input class="form-check-input"
                           type="checkbox"
                           name="contestantIds"
                           th:value="${c.id}"
                           th:id="${'c-' + c.id}"
                           th:checked="${selectedContestantIds.contains(c.id)}">

                    <label class="form-check-label"
                           th:for="${'c-' + c.id}"
                           th:text="${c.fullName}">

                        Contestant Name

                    </label>

                </div>

            </div>

        </div>


        <!-- START AND END TIME -->
        <div class="row">

            <!-- START TIME -->
            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Voting Opens
                </label>

                <input type="datetime-local"
                       class="form-control"
                       th:field="*{startTime}"
                       th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('startTime')}"
                     th:errors="*{startTime}">
                </div>

            </div>


            <!-- END TIME -->
            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Voting Closes
                </label>

                <input type="datetime-local"
                       class="form-control"
                       th:field="*{endTime}"
                       th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid'">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('endTime')}"
                     th:errors="*{endTime}">
                </div>

            </div>

        </div>


        <!-- BUTTONS -->
        <div class="d-flex gap-2 mt-2">

            <button type="submit"
                    class="btn btn-accent px-4">

                <i class="fa-solid fa-check"></i>
                Save Changes

            </button>


            <a class="btn btn-outline-secondary"
               th:href="@{'/admin/voting-sessions/' + ${votingSession.id}}">

                Cancel

            </a>

        </div>

    </form>

</div>

</body>
</html>
