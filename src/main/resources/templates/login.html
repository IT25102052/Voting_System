<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page" style="max-width:420px">
    <div class="pass-card">
        <div class="pass-strip"></div>
        <div class="pass-body">
            <div class="pass-label"><i class="fa-solid fa-lock"></i> Sign In</div>
            <h4 class="rv-display mb-4" style="font-size:1.8rem;">Login</h4>
            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label class="form-label" style="color:rgba(255,255,255,.85);">Email</label>
                    <input type="text" name="username" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color:rgba(255,255,255,.85);">Password</label>
                    <input type="password" name="password" class="form-control">
                </div>
                <button type="submit" class="btn btn-accent w-100 mt-2"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
            </form>
            <small class="d-block mt-3 text-center rv-mono" style="color:rgba(255,255,255,.5); font-size:.72rem;">
                Demo credentials: admin@realityvote.lk / Admin@123
            </small>
            <small class="d-block mt-2 text-center rv-mono" style="color:rgba(255,255,255,.5); font-size:.78rem;">
                New here? <a th:href="@{/register}" style="color:var(--rv-gold);">Create a voter account</a>
            </small>
        </div>
    </div>
</div>
</body>
</html>
