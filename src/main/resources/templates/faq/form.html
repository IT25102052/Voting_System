<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Edit FAQ' : 'Add FAQ')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page" style="max-width:600px">
    <h2 class="rv-page-title mb-4" th:text="${isEdit} ? 'Edit FAQ' : 'Add FAQ'"></h2>

    <form class="rv-card" th:object="${faq}" method="post"
          th:action="${isEdit} ? @{'/staff/faqs/' + ${faq.id}} : @{/staff/faqs}">
        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" class="form-control" placeholder="e.g. Registration, Voting, Account" th:field="*{category}"
                   th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Question</label>
            <input type="text" class="form-control" th:field="*{question}"
                   th:classappend="${#fields.hasErrors('question')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('question')}" th:errors="*{question}"></div>
        </div>
        <div class="mb-4">
            <label class="form-label">Answer</label>
            <textarea class="form-control" rows="4" th:field="*{answer}"
                      th:classappend="${#fields.hasErrors('answer')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('answer')}" th:errors="*{answer}"></div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-accent px-4" th:text="${isEdit} ? 'Save Changes' : 'Add FAQ'"></button>
            <a class="btn btn-outline-secondary" th:href="@{/staff/faqs}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
