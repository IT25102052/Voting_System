<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page" style="max-width:640px">
    <h2 class="rv-page-title mb-4"><i class="fa-solid fa-user-gear"></i> My Profile</h2>

    <div role="alert" class="alert alert-success" th:if="${profileSuccessMessage}" th:text="${profileSuccessMessage}"></div>

    <div class="rv-card mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="text-muted">Account type</span>
            <span class="fw-semibold" th:text="${user.role}">VIEWER</span>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <span class="text-muted">Member since</span>
            <span th:text="${user.createdDate}">-</span>
        </div>
    </div>

    <ul class="nav rv-tabs nav-tabs mb-3" id="profileTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-account-btn" data-bs-toggle="tab" data-bs-target="#tab-account"
                    type="button" role="tab" aria-controls="tab-account" aria-selected="true">
                <i class="fa-solid fa-id-card"></i> Account
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-security-btn" data-bs-toggle="tab" data-bs-target="#tab-security"
                    type="button" role="tab" aria-controls="tab-security" aria-selected="false">
                <i class="fa-solid fa-lock"></i> Security
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-links-btn" data-bs-toggle="tab" data-bs-target="#tab-links"
                    type="button" role="tab" aria-controls="tab-links" aria-selected="false">
                <i class="fa-solid fa-compass"></i> Quick Links
            </button>
        </li>
    </ul>

    <div class="tab-content" id="profileTabsContent">

        <div class="tab-pane fade show active" id="tab-account" role="tabpanel" aria-labelledby="tab-account-btn">
            <form class="rv-card" method="post" th:action="@{/profile}" th:object="${profileForm}">
                <h5 class="mb-3">Edit Details</h5>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" th:field="*{fullName}"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Email</label>
                    <input type="text" class="form-control" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    <small class="text-muted">Changing your email also changes your login - you'll need to log in again afterward.</small>
                </div>

                <button type="submit" class="btn btn-accent px-4"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
            </form>
        </div>

        <div class="tab-pane fade" id="tab-security" role="tabpanel" aria-labelledby="tab-security-btn">
            <form class="rv-card" method="post" th:action="@{/profile/password}" th:object="${passwordForm}">
                <h5 class="mb-3">Change Password</h5>

                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input type="password" class="form-control" th:field="*{currentPassword}"
                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" th:field="*{newPassword}"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" th:field="*{confirmNewPassword}"
                           th:classappend="${#fields.hasErrors('confirmNewPassword')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmNewPassword')}" th:errors="*{confirmNewPassword}"></div>
                </div>

                <button type="submit" class="btn btn-outline-secondary px-4"><i class="fa-solid fa-key"></i> Change Password</button>
            </form>
        </div>

        <div class="tab-pane fade" id="tab-links" role="tabpanel" aria-labelledby="tab-links-btn">
            <div class="rv-card">
                <h5 class="mb-3">Quick Links</h5>
                <div class="d-flex flex-column gap-2">
                    <a class="btn btn-outline-dark text-start" sec:authorize="hasRole('VIEWER')" th:href="@{/vote}">
                        <i class="fa-solid fa-check-to-slot"></i> Vote Now
                    </a>
                    <a class="btn btn-outline-dark text-start" sec:authorize="hasRole('VIEWER')" th:href="@{/vote/history}">
                        <i class="fa-solid fa-clock-rotate-left"></i> My Voting History
                    </a>
                    <a class="btn btn-outline-dark text-start" sec:authorize="hasRole('VIEWER')" th:href="@{/support/tickets}">
                        <i class="fa-solid fa-headset"></i> Support Tickets
                    </a>
                    <a class="btn btn-outline-dark text-start" sec:authorize="hasRole('JUDGE')" th:href="@{/judge/scores}">
                        <i class="fa-solid fa-gavel"></i> My Episodes to Judge
                    </a>
                    <a class="btn btn-outline-dark text-start" sec:authorize="hasRole('JUDGE')" th:href="@{/judge/scores/history}">
                        <i class="fa-solid fa-clock-rotate-left"></i> My Scoring History
                    </a>
                    <a class="btn btn-outline-dark text-start" sec:authorize="hasRole('ADMINISTRATOR')" th:href="@{/reports/dashboard}">
                        <i class="fa-solid fa-chart-line"></i> Reports Dashboard
                    </a>
                    <a class="btn btn-outline-dark text-start" sec:authorize="hasAnyRole('ADMINISTRATOR','CONTESTANT_STAFF')" th:href="@{/staff/contestants}">
                        <i class="fa-solid fa-users"></i> Manage Contestants
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
