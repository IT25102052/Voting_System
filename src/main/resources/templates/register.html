<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page" style="max-width:460px">
    <div class="pass-card">
        <div class="pass-strip"></div>
        <div class="pass-body">
            <div class="pass-label"><i class="fa-solid fa-check-to-slot"></i> Voter Sign-Up</div>
            <h4 class="rv-display mb-4" style="font-size:1.8rem;">Create Your Account</h4>
            <p style="color:rgba(255,255,255,.65); font-size:.9rem; margin-top:-.75rem;">
                Register to vote for your favorite contestants. Contestants and crew accounts are managed separately by the show admin.
            </p>

            <form method="post" th:action="@{/register}" th:object="${registrationForm}">

                <div class="mb-3">
                    <label class="form-label" style="color:rgba(255,255,255,.85);">Full Name</label>
                    <input type="text" class="form-control" th:field="*{fullName}"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" style="color:rgba(255,255,255,.85);">Email</label>
                    <input type="text" class="form-control" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" style="color:rgba(255,255,255,.85);">Password</label>
                    <input type="password" class="form-control" th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" style="color:rgba(255,255,255,.85);">Confirm Password</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-accent w-100 mt-2"><i class="fa-solid fa-user-plus"></i> Create Account</button>
            </form>

            <small class="d-block mt-3 text-center rv-mono" style="color:rgba(255,255,255,.5); font-size:.78rem;">
                Already have an account? <a th:href="@{/login}" style="color:var(--rv-gold);">Log in</a>
            </small>
        </div>
    </div>
</div>
</body>
</html>
