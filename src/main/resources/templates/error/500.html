<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Server Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="rv-page text-center py-5">
    <h1 class="rv-page-title display-4">500</h1>

    <a class="btn btn-accent mt-3" th:href="@{/}"><i class="fa-solid fa-home me-1"></i> Back to Home</a>
</div>
</body>
</html>
