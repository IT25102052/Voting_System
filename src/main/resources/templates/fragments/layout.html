<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Reality Vote'">Reality Vote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark rv-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="fa-solid fa-star"></i> Reality<span class="text-accent">Vote</span>
            <span style="width:7px;height:7px;background:#ff1ee9;border-radius:50%;box-shadow:0 0 0 3px rgba(255,30,233,.25);display:inline-block;margin-left:.2rem;" title="Live"></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRATOR')">
                    <a class="nav-link" th:href="@{/admin/shows}">
                        <i class="fa-solid fa-tv"></i> Manage Shows
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRATOR')">
                    <a class="nav-link" th:href="@{/admin/voting-sessions}">
                        <i class="fa-solid fa-square-poll-vertical"></i> Voting Sessions
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRATOR','CONTESTANT_STAFF')">
                    <a class="nav-link" th:href="@{/staff/contestants}">
                        <i class="fa-solid fa-users"></i> Contestants
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRATOR')">
                    <a class="nav-link" th:href="@{/admin/judges}">
                        <i class="fa-solid fa-gavel"></i> Judges &amp; Panels
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('JUDGE')">
                    <a class="nav-link" th:href="@{/judge/scores}">
                        <i class="fa-solid fa-star-half-stroke"></i> Score Contestants
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('JUDGE')">
                    <a class="nav-link" th:href="@{/judge/scores/history}">
                        <i class="fa-solid fa-clock-rotate-left"></i> My Scores
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('VIEWER')">
                    <a class="nav-link" th:href="@{/vote}">
                        <i class="fa-solid fa-check-to-slot"></i> Vote Now
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('VIEWER')">
                    <a class="nav-link" th:href="@{/vote/history}">
                        <i class="fa-solid fa-clock-rotate-left"></i> My Votes
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('VIEWER')">
                    <a class="nav-link" th:href="@{/support/tickets}">
                        <i class="fa-solid fa-headset"></i> Support
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRATOR','SUPPORT_STAFF')">
                    <a class="nav-link" th:href="@{/staff/support/tickets}">
                        <i class="fa-solid fa-headset"></i> Tickets
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRATOR','SUPPORT_STAFF')">
                    <a class="nav-link" th:href="@{/staff/faqs}">
                        <i class="fa-solid fa-circle-question"></i> FAQs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/faq}">
                        <i class="fa-regular fa-circle-question"></i> Help
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRATOR','COMPLIANCE_OFFICER')">
                    <a class="nav-link" th:href="@{/compliance/audit-logs}">
                        <i class="fa-solid fa-shield-halved"></i> Audit Logs
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRATOR','REPORTING_MANAGER')">
                    <a class="nav-link" th:href="@{/reports/dashboard}">
                        <i class="fa-solid fa-chart-line"></i> Reports
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/profile}">
                        <i class="fa-solid fa-user"></i> Profile
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-light ms-2">Logout</button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/register}">Register</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-sm btn-accent ms-2" th:href="@{/login}">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
