<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Campaign Detail')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="rv-page" style="max-width:900px">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h2 class="rv-page-title mb-0"><i class="fa-solid fa-folder-open"></i> Campaign Detail</h2>
        <a th:href="@{/marketing/campaigns}" class="btn btn-sm btn-outline-dark"><i class="fa-solid fa-arrow-left"></i> Back</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show"><span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

    <!-- Campaign info card -->
    <div class="rv-card mb-3">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
                <h4 class="mb-1" th:text="${campaign.name}"></h4>
                <span class="status-badge rv-mono" th:classappend="'status-' + ${campaign.status}" th:text="${campaign.status}"></span>
                <span class="rv-mono small text-muted ms-2">ID #<span th:text="${campaign.id}"></span></span>
            </div>
            <div class="rv-mono small text-muted text-end">
                Created by <span th:text="${campaign.createdBy.fullName}"></span><br>
                <span th:text="${#temporals.format(campaign.createdDate, 'dd MMM yyyy HH:mm')}"></span>
            </div>
        </div>
        <p class="text-muted mb-2" th:if="${campaign.description}" th:text="${campaign.description}"></p>
        <div class="rv-mono small text-muted">
            <i class="fa-solid fa-calendar"></i>
            <span th:text="${campaign.startDate}"></span> → <span th:text="${campaign.endDate}"></span>
        </div>

        <!-- Edit form (only for DRAFT) -->
        <div th:if="${campaign.status.name() == 'DRAFT'}" class="mt-3 pt-3" style="border-top:1px solid var(--rv-border)">
            <form th:action="@{/marketing/campaigns/{id}/edit(id=${campaign.id})}" method="post">
                <div class="row g-2 mb-2">
                    <div class="col-md-6">
                        <input type="text" class="form-control form-control-sm" name="name" th:value="${campaign.name}" required>
                    </div>
                    <div class="col-md-3">
                        <input type="date" class="form-control form-control-sm" name="startDate" th:value="${campaign.startDate}" required>
                    </div>
                    <div class="col-md-3">
                        <input type="date" class="form-control form-control-sm" name="endDate" th:value="${campaign.endDate}" required>
                    </div>
                </div>
                <textarea class="form-control form-control-sm mb-2" name="description" rows="2" th:text="${campaign.description}" placeholder="Description…"></textarea>
                <button type="submit" class="btn btn-sm btn-outline-dark"><i class="fa-solid fa-save"></i> Save Changes</button>
            </form>
        </div>

        <!-- Action buttons -->
        <div class="d-flex gap-2 mt-3">
            <form th:if="${campaign.status.name() == 'DRAFT'}" th:action="@{/marketing/campaigns/{id}/activate(id=${campaign.id})}" method="post">
                <button class="btn btn-sm btn-accent"><i class="fa-solid fa-rocket"></i> Activate Campaign</button>
            </form>
            <form th:if="${campaign.status.name() == 'ACTIVE'}" th:action="@{/marketing/campaigns/{id}/complete(id=${campaign.id})}" method="post">
                <button class="btn btn-sm btn-outline-warning"><i class="fa-solid fa-flag-checkered"></i> Mark Completed</button>
            </form>
        </div>
    </div>

    <!-- Advertisements in this campaign -->
    <div class="rv-card">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h5 class="rv-page-title mb-0"><i class="fa-solid fa-rectangle-ad"></i> Advertisements</h5>
            <a th:if="${campaign.status.name() != 'COMPLETED' and campaign.status.name() != 'ARCHIVED'}"
               th:href="@{/marketing/campaigns/{id}/advertisements/create(id=${campaign.id})}" class="btn btn-sm btn-accent">
                <i class="fa-solid fa-plus"></i> New Ad
            </a>
        </div>
        <div class="table-responsive">
            <table class="table table-sm mb-0">
                <thead>
                <tr class="rv-mono" style="font-size:.75rem;color:var(--rv-text-muted)">
                    <th>TITLE</th><th>STATUS</th><th>REVIEWED BY</th><th>CREATED</th><th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ad : ${advertisements}">
                    <td th:text="${ad.title}"></td>
                    <td><span class="status-badge rv-mono" th:classappend="'status-' + ${ad.status}" th:text="${ad.status}"></span></td>
                    <td class="small text-muted" th:text="${ad.reviewedBy != null ? ad.reviewedBy.fullName : '—'}"></td>
                    <td class="rv-mono small text-muted" th:text="${#temporals.format(ad.createdDate, 'dd MMM')}"></td>
                    <td><a th:href="@{/marketing/advertisements/{id}(id=${ad.id})}" class="btn btn-sm btn-outline-dark"><i class="fa-solid fa-eye"></i></a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(advertisements)}">
                    <td colspan="5" class="text-center text-muted py-3">No advertisements in this campaign yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
