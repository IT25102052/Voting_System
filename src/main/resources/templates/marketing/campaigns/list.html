<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Campaigns')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="rv-page">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h2 class="rv-page-title mb-0"><i class="fa-solid fa-folder-open"></i> Advertising Campaigns</h2>
        <a th:href="@{/marketing/campaigns/create}" class="btn btn-accent">
            <i class="fa-solid fa-plus"></i> New Campaign
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show"><span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

    <div class="rv-card">
        <div class="table-responsive">
            <table class="table table-sm mb-0">
                <thead>
                <tr class="rv-mono" style="font-size:.75rem;color:var(--rv-text-muted)">
                    <th>#</th><th>NAME</th><th>STATUS</th><th>START</th><th>END</th><th>ADS</th><th>CREATED BY</th><th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${campaigns}">
                    <td class="rv-mono" th:text="${c.id}"></td>
                    <td th:text="${c.name}"></td>
                    <td><span class="status-badge rv-mono" th:classappend="'status-' + ${c.status}" th:text="${c.status}"></span></td>
                    <td class="rv-mono small" th:text="${c.startDate}"></td>
                    <td class="rv-mono small" th:text="${c.endDate}"></td>
                    <td class="rv-mono" th:text="${#lists.size(c.advertisements)}"></td>
                    <td class="small text-muted" th:text="${c.createdBy.fullName}"></td>
                    <td><a th:href="@{/marketing/campaigns/{id}(id=${c.id})}" class="btn btn-sm btn-outline-dark"><i class="fa-solid fa-eye"></i></a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(campaigns)}">
                    <td colspan="8" class="text-center text-muted py-4">No campaigns yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
