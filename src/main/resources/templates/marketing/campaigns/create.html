<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New Campaign')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="rv-page" style="max-width:700px">
    <h2 class="rv-page-title mb-4"><i class="fa-solid fa-plus-circle"></i> Create Campaign</h2>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

    <div class="rv-card">
        <form th:action="@{/marketing/campaigns/create}" th:object="${campaign}" method="post">
            <div class="mb-3">
                <label class="form-label rv-mono small">CAMPAIGN NAME *</label>
                <input type="text" class="form-control" th:field="*{name}" required placeholder="e.g. Season 5 Launch Promotion">
            </div>
            <div class="mb-3">
                <label class="form-label rv-mono small">DESCRIPTION</label>
                <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Optional description…"></textarea>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label rv-mono small">START DATE *</label>
                    <input type="date" class="form-control" th:field="*{startDate}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label rv-mono small">END DATE *</label>
                    <input type="date" class="form-control" th:field="*{endDate}" required>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-accent"><i class="fa-solid fa-save"></i> Create Campaign</button>
                <a th:href="@{/marketing/campaigns}" class="btn btn-outline-dark">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
