<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contestants')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page" style="max-width:1200px">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="rv-page-title"><i class="fa-solid fa-users"></i> Contestant Management</h2>
        <a class="btn btn-accent" th:href="@{/staff/contestants/new}">
            <i class="fa-solid fa-user-plus"></i> Add Contestant
        </a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <!-- Search + Filter -->
    <form class="rv-card mb-4 row g-2 align-items-end" method="get" th:action="@{/staff/contestants}">
        <div class="col-md-4">
            <label class="form-label mb-1">Search by name</label>
            <input type="text" name="keyword" class="form-control" th:value="${keyword}" placeholder="Contestant name...">
        </div>
        <div class="col-md-3">
            <label class="form-label mb-1">Show</label>
            <select name="showId" class="form-select">
                <option value="">All Shows</option>
                <option th:each="s : ${shows}" th:value="${s.id}" th:text="${s.name}"
                        th:selected="${showId != null and showId == s.id}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label mb-1">Status</label>
            <select name="status" class="form-select">
                <option value="">All Statuses</option>
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"
                        th:selected="${status != null and status == st}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-outline-dark w-100" type="submit">Apply</button>
        </div>
    </form>

    <!-- Empty state -->
    <div class="rv-card text-center py-5" th:if="${contestantPage.totalElements == 0}">
        <i class="fa-solid fa-user-slash fa-2x mb-3" style="color:#4a4d58"></i>
        <p class="text-muted mb-0">No contestants match your search.</p>
    </div>

    <!-- Grid -->
    <div class="row g-3" th:unless="${contestantPage.totalElements == 0}">
        <div class="col-md-4" th:each="c : ${contestantPage.content}">
            <div class="show-card h-100">
                <div class="d-flex gap-3">
                    <img th:if="${c.photoPath}" th:src="@{'/uploads/' + ${c.photoPath}}"
                         style="width:64px;height:64px;object-fit:cover;border-radius:12px" alt="">
                    <div th:unless="${c.photoPath}"
                         style="width:64px;height:64px;border-radius:12px;background:#ece9f7;display:flex;align-items:center;justify-content:center">
                        <i class="fa-solid fa-user" style="color:#5a5e6a"></i>
                    </div>
                    <div>
                        <h6 class="mb-1" th:text="${c.fullName}">Name</h6>
                        <span class="status-badge" th:classappend="'status-' + ${c.status}" th:text="${c.status}"></span>
                        <p class="text-muted small mb-0 mt-1" th:text="${c.talentCategory} + ' · ' + ${c.hometown}"></p>
                        <small class="text-muted" th:text="${c.show.name}"></small>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <a class="btn btn-sm btn-outline-secondary flex-fill" th:href="@{'/staff/contestants/' + ${c.id}}">View</a>
                    <a class="btn btn-sm btn-outline-primary flex-fill" th:href="@{'/staff/contestants/' + ${c.id} + '/edit'}">Edit</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav class="mt-4" th:if="${contestantPage.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, contestantPage.totalPages - 1)}"
                th:classappend="${i == contestantPage.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/staff/contestants(page=${i}, keyword=${keyword}, showId=${showId}, status=${status})}"
                   th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>

</div>
</body>
</html>
