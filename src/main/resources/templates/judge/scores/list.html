<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Score Contestants')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="rv-page" style="max-width:900px">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="rv-page-title"><i class="fa-solid fa-star-half-stroke"></i> Your Assigned Episodes</h2>
        <a class="btn btn-outline-dark" th:href="@{/judge/scores/history}">
            <i class="fa-solid fa-clock-rotate-left"></i> My Scoring History
        </a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="rv-card text-center py-5" th:if="${#lists.isEmpty(episodes)}">
        <i class="fa-solid fa-gavel fa-2x mb-3" style="color:#4a4d58"></i>
        <p class="text-muted mb-0">You're not on any judging panel yet. Ask an administrator to assign you.</p>
    </div>

    <div class="row g-3" th:unless="${#lists.isEmpty(episodes)}">
        <div class="col-md-6" th:each="ep : ${episodes}">
            <div class="show-card h-100">
                <h6 class="mb-1" th:text="'Ep. ' + ${ep.episodeNumber} + ' — ' + ${ep.title}"></h6>
                <p class="text-muted small mb-1" th:text="'Season ' + ${ep.season.seasonNumber} + ' · ' + ${ep.season.show.name}"></p>
                <span class="status-badge" th:classappend="${ep.judgingOpen} ? 'status-OPEN' : 'status-CLOSED'"
                      th:text="${ep.judgingOpen} ? 'Judging Open' : 'Judging Closed'"></span>
                <div class="mt-3">
                    <a class="btn btn-sm btn-accent w-100" th:href="@{'/judge/scores/episodes/' + ${ep.id}}">
                        View Contestants &amp; Score
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
