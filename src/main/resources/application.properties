# ===================================================================
# Application
# ===================================================================
spring.application.name=reality-vote
server.port=8080

# ===================================================================
# MySQL Database
# Create the database first: CREATE DATABASE reality_vote_db;
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/reality_vote_db?useSSL=false&allowPublicsKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Th4nuj4
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate
# ddl-auto=update -> Hibernate creates/updates tables from our @Entity classes.
# Switch to "validate" once the schema is stable, closer to submission.
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Explicitly acknowledging Open Session In View (Spring Boot's default).
# This is what lets Thymeleaf templates lazily navigate relationships like
# session.episode.season.show.name without a LazyInitializationException -
# the persistence context stays open for the whole request/render cycle.
spring.jpa.open-in-view=true

# ===================================================================
# Thymeleaf
# cache=false while developing so template edits show up without a restart
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===================================================================
# File upload (for contestant photos / show banners later)
# ===================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
