<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vote Now')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="on-air-strip"><span class="dot"></span> Live voting sessions &middot; Cast your vote now</div>

<div class="rv-page" style="max-width:860px">
    <h2 class="rv-page-title mb-3"><i class="fa-solid fa-check-to-slot"></i> Open Voting Sessions</h2>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <!-- Featured Sponsors Banner (if open sessions have approved ads) -->
    <div th:if="${featuredAds != null and !featuredAds.isEmpty()}" class="mb-4">
        <div class="rv-card p-3" style="border: 1px solid rgba(255, 200, 87, 0.25); background: linear-gradient(135deg, rgba(255, 200, 87, 0.05) 0%, rgba(20, 23, 34, 0.9) 100%);">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="badge" style="background:var(--rv-gold); color:#0e1017; font-weight:700; font-size:0.68rem;">
                    <i class="fa-solid fa-star me-1"></i> BROADCAST PARTNERS
                </span>
                <span class="rv-mono small text-muted">Official Show Sponsors</span>
            </div>
            <div class="d-flex flex-wrap gap-3 mt-2">
                <div th:each="fad : ${featuredAds}" class="d-flex align-items-center gap-2 p-2"
                     style="background:rgba(0,0,0,0.3); border-radius:8px; border:1px solid var(--rv-border); max-width:380px;">
                    <img th:if="${fad.imageUrl}" th:src="${fad.imageUrl}" alt=""
                         style="width:44px; height:44px; object-fit:cover; border-radius:6px; flex-shrink:0;">
                    <div style="overflow:hidden;">
                        <strong class="d-block text-truncate" style="font-size:0.85rem; color:var(--rv-gold);" th:text="${fad.title}"></strong>
                        <small class="text-muted d-block text-truncate" th:text="${fad.content}"></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sessions List -->
    <div class="rv-card text-center py-5" th:if="${#lists.isEmpty(sessions)}">
        <i class="fa-solid fa-clock fa-2x mb-3" style="color:#4a4d58"></i>
        <p class="text-muted mb-0">No voting sessions are open right now. Check back soon!</p>
    </div>

    <div th:each="s : ${sessions}" class="show-card d-flex justify-content-between align-items-center mb-3">
        <div>
            <div class="d-flex align-items-center gap-2 mb-1">
                <h6 class="mb-0" th:text="${s.episode != null ? (s.episode.season.show.name + ' — Ep. ' + s.episode.episodeNumber + ': ' + s.episode.title) : ('Session #' + s.id)}">Show</h6>
                <span class="badge" style="background:rgba(42,240,160,0.15); color:#2af0a0; font-size:0.68rem;">OPEN</span>
            </div>
            <small class="text-muted">Voting closes <span th:text="${s.endTime}"></span></small>
        </div>
        <a class="btn btn-sm btn-accent" th:href="@{'/vote/' + ${s.id}}">
            <i class="fa-solid fa-check-to-slot me-1"></i> Vote Now
        </a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
